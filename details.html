<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ticket Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f8f9fa;
      color: #003366;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h1 {
      color: #007bff;
      text-align: center;
      margin-bottom: 20px;
    }
    img {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.1em;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    a.back-btn {
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 12px 22px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    a.back-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<h1>Ticket Details</h1>

<img id="productImage" src="" alt="Ticket Image" />
<h2 id="productTitle"></h2>
<p id="productDescription"></p>

<a href="index.html" class="back-btn">← Back to Home</a>

<script>
  // Get the ticket type from the URL
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type');

  const details = {
    concert: {
      title: "Live Concert Ticket",
      description: "Experience the thrill of live music with our exclusive concert tickets. Book now to enjoy your favorite artists up close.",
      image: "https://images.pexels.com/photos/1190297/pexels-photo-1190297.jpeg"
    },
    movie: {
      title: "Movie Night Ticket",
      description: "Enjoy the latest blockbusters in comfort. Grab your movie ticket today and plan a perfect night out.",
      image: "https://images.pexels.com/photos/799137/pexels-photo-799137.jpeg"
    },
    flight: {
      title: "Flight Booking Ticket",
      description: "Book your flight tickets easily with our secure platform. Fly to your dream destination without hassle.",
      image: "https://images.pexels.com/photos/1309644/pexels-photo-1309644.jpeg"
    },
    sports: {
      title: "Football Match Ticket",
      description: "Catch the exciting football matches live! Reserve your seats for thrilling action and unforgettable moments.",
      image: "https://images.pexels.com/photos/3991878/pexels-photo-3991878.jpeg"
    },
    event: {
      title: "Festival Entry Ticket",
      description: "Join the biggest festivals and events. Secure your entry ticket now and be part of the celebration.",
      image: "https://images.pexels.com/photos/167636/pexels-photo-167636.jpeg"
    }
  };

  if (type && details[type]) {
    document.getElementById('productTitle').textContent = details[type].title;
    document.getElementById('productDescription').textContent = details[type].description;
    document.getElementById('productImage').src = details[type].image;
    document.getElementById('productImage').alt = details[type].title;
  } else {
    document.getElementById('productTitle').textContent = "Product Not Found";
    document.getElementById('productDescription').textContent = "Sorry, we couldn't find details for this ticket.";
    document.getElementById('productImage').style.display = "none";
  }
</script>

</body>
</html>
