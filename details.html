<!DOCTYPE html>
<html>
<head>
  <title>Hide Div Example</title>
  <style>
    .container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .box {
      width: 100px;
      height: 100px;
      background-color: skyblue;
      text-align: center;
      line-height: 100px;
      font-weight: bold;
      border: 2px solid black;
    }

    #left {
      background-color: lightgreen;
    }

    #middle {
      background-color: orange;
    }

    #right {
      background-color: lightcoral;
    }
  </style>
</head>
<body>

  <h2>Hide Middle Div Using JavaScript</h2>

  <div class="container">
    <div id="left" class="box">Left</div>
    <div id="middle" class="box">Middle</div>
    <div id="right" class="box">Right</div>
  </div>

  <br />

  <button onclick="hideUsingVisibility()">Hide (Visibility Hidden)</button>
  <button onclick="hideUsingDisplay()">Hide (Display None)</button>
  <button onclick="showMiddle()">Show Middle</button>

  <script>
    function hideUsingVisibility() {
      document.getElementById("middle").style.visibility = "hidden";
    }

    function hideUsingDisplay() {
      document.getElementById("middle").style.display = "none";
    }

    function showMiddle() {
      const middle = document.getElementById("middle");
      middle.style.visibility = "visible";
      middle.style.display = "block";
    }
  </script>

</body>
</html>
