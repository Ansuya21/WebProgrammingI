<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ticket Details - Ticket Bazaar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e3f2fd;
      color: #222;
      padding: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    header {
      background-color: #0d47a1;
      color: white;
      padding: 20px;
      text-align: center;
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 1.2px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    h2 {
      color: #1565c0;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(25, 118, 210, 0.3);
      margin-bottom: 20px;
    }

    p.description {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #333;
      margin-bottom: 30px;
    }

    .btn {
      background-color: #0d47a1;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      display: inline-block;
      text-align: center;
      box-shadow: 0 4px 12px rgba(13, 71, 161, 0.6);
      margin-right: 15px;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #1565c0;
      box-shadow: 0 6px 18px rgba(21, 101, 192, 0.8);
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding: 15px 0;
      font-weight: 600;
      color: #0d47a1;
      letter-spacing: 0.7px;
    }
  </style>
</head>
<body>

<header>
  <h1>Ticket Bazaar</h1>
</header>

<main>
  <h2 id="ticket-title">Loading...</h2>
  <img id="ticket-image" src="" alt="Ticket Image" />
  <p class="description" id="ticket-description">Please wait while we load the details.</p>

  <button class="btn" id="book-btn">Book Now</button>
  <a href="index.html" class="btn" id="back-btn">← Back to Home</a>
</main>

<footer>
  &copy; 2025 Ticket Bazaar | All Rights Reserved
</footer>

<script>
  const tickets = {
    concert: {
      title: "Live Concert Ticket",
      img: "https://images.pexels.com/photos/1190297/pexels-photo-1190297.jpeg",
      description: "Experience the thrill of live music with our exclusive concert tickets. Get front-row access to your favorite artists and unforgettable nights."
    },
    movie: {
      title: "Movie Night Ticket",
      img: "https://images.pexels.com/photos/799137/pexels-photo-799137.jpeg",
      description: "Enjoy the latest blockbusters at your local theater. Grab your popcorn and settle in for an amazing movie night experience."
    },
    flight: {
      title: "Flight Booking Ticket",
      img: "https://images.pexels.com/photos/1309644/pexels-photo-1309644.jpeg",
      description: "Book your flights with ease and convenience. Travel the world or visit loved ones with our affordable and reliable flight tickets."
    },
    sports: {
      title: "Football Match Ticket",
      img: "https://images.pexels.com/photos/3991878/pexels-photo-3991878.jpeg",
      description: "Catch the excitement of the game live! Get your tickets to thrilling football matches featuring top clubs and passionate fans."
    },
    event: {
      title: "Festival Entry Ticket",
      img: "https://images.pexels.com/photos/167636/pexels-photo-167636.jpeg",
      description: "Join the festivities and celebrate culture with our festival entry tickets. Enjoy music, food, and unforgettable moments."
    }
  };

  const params = new URLSearchParams(window.location.search);
  const type = params.get('type');

  const titleElem = document.getElementById('ticket-title');
  const imgElem = document.getElementById('ticket-image');
  const descElem = document.getElementById('ticket-description');
  const bookBtn = document.getElementById('book-btn');

  if (type && tickets[type]) {
    const ticket = tickets[type];
    titleElem.textContent = ticket.title;
    imgElem.src = ticket.img;
    imgElem.alt = ticket.title;
    descElem.textContent = ticket.description;

    // Add event listener to booking button
    bookBtn.onclick = () => {
      alert(`Thank you for choosing to book the "${ticket.title}". Booking process coming soon!`);
    };
  } else {
    titleElem.textContent = "Ticket Not Found";
    imgElem.style.display = "none";
    descElem.textContent = "Sorry, the ticket you're looking for does not exist or the link is invalid.";
    bookBtn.style.display = 'none';
  }
</script>

</body>
</html>
