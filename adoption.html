<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Adoption Form - Happy Tails Adoption</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header><h1>Adoption Form</h1></header>
  <main>
    <form action="#" method="post" style="padding: 1em; max-width: 400px; margin: auto;">
      <label for="name">Full Name:</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="phone">Phone Number:</label><br>
      <input type="tel" id="phone" name="phone" required><br><br>

      <label for="dog">Which dog would you like to adopt?</label><br>
      <select id="dog" name="dog" required>
        <option value="">--Select Dog--</option>
        <option value="Max">Max</option>
        <option value="Luna">Luna</option>
        <option value="Rocky">Rocky</option>
        <option value="Bella">Bella</option>
        <option value="Charlie">Charlie</option>
      </select><br><br>

      <label for="reason">Why do you want to adopt?</label><br>
      <textarea id="reason" name="reason" required></textarea><br><br>

      <button type="submit" class="adopt-btn">Submit</button>
    </form>
  </main>
</body>
</html>
