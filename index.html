<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ticket Bazaar - Book Your Tickets Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #83a4d4, #b6fbff);
      color: #222;
      min-height: 100vh;
    }

    header {
      background-color: #1565c0;
      color: white;
      padding: 25px 20px;
      text-align: center;
      font-weight: 700;
      font-size: 2.5rem;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 12px rgba(21, 101, 192, 0.7);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header p {
      margin-top: 8px;
      font-weight: 500;
      font-size: 1.2rem;
      letter-spacing: 0.8px;
      color: #dbe9ff;
    }

    h2 {
      text-align: center;
      margin: 40px 0 25px;
      font-size: 2rem;
      color: #0d47a1;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.15);
    }

    .ticket-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 0 15px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .ticket-item {
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.12);
      width: 260px;
      text-align: center;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .ticket-item:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 15px 25px rgba(21, 101, 192, 0.5);
    }

    .ticket-item img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-bottom: 3px solid #1565c0;
      flex-shrink: 0;
    }

    .ticket-item p {
      font-weight: 600;
      font-size: 1.1rem;
      margin: 14px 0 20px;
      color: #1565c0;
      flex-grow: 1;
      padding: 0 10px;
    }

    .ticket-item a.book-btn {
      background-color: #1565c0;
      color: white;
      text-decoration: none;
      padding: 12px 0;
      font-weight: 700;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
      transition: background-color 0.3s ease;
      display: block;
    }

    .ticket-item a.book-btn:hover {
      background-color: #0d47a1;
    }

    footer {
      background-color: #1565c0;
      color: white;
      text-align: center;
      padding: 20px 15px;
      font-weight: 700;
      letter-spacing: 0.9px;
      box-shadow: 0 -4px 10px rgba(21, 101, 192, 0.7);
      margin-top: 30px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .ticket-item {
        width: 45%;
      }
    }

    @media (max-width: 600px) {
      .ticket-gallery {
        gap: 18px;
      }
      .ticket-item {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Ticket Bazaar</h1>
  <p>Your One-Stop Destination for All Tickets</p>
</header>

<h2>Available Tickets</h2>

<div class="ticket-gallery">
  <div class="ticket-item" tabindex="0" role="link" aria-label="Live Concert Ticket Details">
    <a href="details.html?type=concert" tabindex="-1">
      <img src="https://images.pexels.com/photos/1190297/pexels-photo-1190297.jpeg" alt="Concert Ticket" />
    </a>
    <p>Live Concert</p>
    <a href="details.html?type=concert" class="book-btn" aria-label="Book Live Concert Ticket">Book Now</a>
  </div>

  <div class="ticket-item" tabindex="0" role="link" aria-label="Movie Night Ticket Details">
    <a href="details.html?type=movie" tabindex="-1">
      <img src="https://images.pexels.com/photos/799137/pexels-photo-799137.jpeg" alt="Movie Ticket" />
    </a>
    <p>Movie Night</p>
    <a href="details.html?type=movie" class="book-btn" aria-label="Book Movie Night Ticket">Book Now</a>
  </div>

  <div class="ticket-item" tabindex="0" role="link" aria-label="Flight Booking Ticket Details">
    <a href="details.html?type=flight" tabindex="-1">
      <img src="https://images.pexels.com/photos/1309644/pexels-photo-1309644.jpeg" alt="Flight Ticket" />
    </a>
    <p>Flight Booking</p>
    <a href="details.html?type=flight" class="book-btn" aria-label="Book Flight Booking Ticket">Book Now</a>
  </div>

  <div class="ticket-item" tabindex="0" role="link" aria-label="Football Match Ticket Details">
    <a href="details.html?type=sports" tabindex="-1">
      <img src="https://images.pexels.com/photos/3991878/pexels-photo-3991878.jpeg" alt="Sports Ticket" />
    </a>
    <p>Football Match</p>
    <a href="details.html?type=sports" class="book-btn" aria-label="Book Football Match Ticket">Book Now</a>
  </div>

  <div class="ticket-item" tabindex="0" role="link" aria-label="Festival Entry Ticket Details">
    <a href="details.html?type=event" tabindex="-1">
      <img src="https://images.pexels.com/photos/167636/pexels-photo-167636.jpeg" alt="Event Ticket" />
    </a>
    <p>Festival Entry</p>
    <a href="details.html?type=event" class="book-btn" aria-label="Book Festival Entry Ticket">Book Now</a>
  </div>
</div>

<footer>
  &copy; 2025 Ticket Bazaar | All Rights Reserved
</footer>

</body>
</html>
