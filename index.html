<!DOCTYPE html>
<html>
<head>
  <title>Nested Divs with Colorful Borders</title>
  <style>
    .div1 {
      background-color: #e0f7fa; /* light cyan */
      padding: 50px;
      border-width: 5px;
      border-style: solid dashed dotted double;
      border-color: red green blue orange;
    }

    .div2 {
      background-color: #dcedc8; /* light green */
      padding: 50px;
      border-width: 5px;
      border-style: dashed dotted double solid;
      border-color: purple teal gold brown;
    }

    .div3 {
      background-color: #fff9c4; /* light yellow */
      padding: 50px;
      border-width: 5px;
      border-style: dotted double solid dashed;
      border-color: darkblue crimson coral sienna;
    }

    .div4 {
      background-color: #f8bbd0; /* light pink */
      padding: 50px;
      border-width: 5px;
      border-style: double solid dashed groove;
      border-color: navy hotpink lime darkorange;
    }

    .div5 {
      background-color: #eeeeee; /* light gray */
      padding: 50px;
      border-width: 5px;
      border-style: ridge inset outset none;
      border-color: darkgreen maroon cyan black;
    }

    p {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      margin: 0;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="div1">
    <div class="div2">
      <div class="div3">
        <div class="div4">
          <div class="div5">
            <p>This is the content inside the colorful nested divs.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
